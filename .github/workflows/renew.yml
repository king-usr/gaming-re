name: Game4Free-Renew

on:
  schedule:
    - cron: "*/30 * * * *"   # 每 30 分钟触发一次（game4free 续期间隔）
  workflow_dispatch:

permissions:
  contents: write   # KeepAlive 需要推送 time.txt
  actions: write

jobs:
  renew:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      # ── 1. 拉取当前仓库（KeepAlive 写 time.txt 用） ──────────────────────
      - name: 📥 拉取当前仓库
        uses: actions/checkout@v4

      # ── 2. 拉取私库脚本 ───────────────────────────────────────────────────
      - name: 📦 拉取私库脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO_NAME }} 
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: private

      - name: 📂 移动脚本到工作目录
        run: mv private/game4free_renew.py game4free_renew.py

      # ── 3. 安装 Cloudflare WARP（替代 GOST，原生 CF IP，对 Turnstile 更友好） ──
      - name: 🌐 安装并启动 Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor \
              --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] \
            https://pkg.cloudflareclient.com/ jammy main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -q
          sudo apt-get install -y cloudflare-warp

          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy       # SOCKS5 监听 127.0.0.1:40000
          warp-cli --accept-tos connect

          echo "⏳ 等待 WARP 隧道建立 (15秒)..."
          sleep 15

          echo "🌍 验证 WARP 出口 IP（最后一段打码）:"
          curl -s -x socks5://127.0.0.1:40000 https://api.ipify.org \
            | sed 's/\([0-9]*\.[0-9]*\.[0-9]*\.\)[0-9]*/\1***/g'
          echo ""

      # ── 4. 安装系统依赖 ──────────────────────────────────────────────────
      - name: 🛠️ 安装系统依赖
        run: |
          sudo apt-get install -y xvfb xdotool

      # ── 5. 设置 Python ───────────────────────────────────────────────────
      - name: 🐍 设置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 6. 安装 Python 依赖 ──────────────────────────────────────────────
      - name: 🐍 安装 Python 依赖
        run: |
          pip install seleniumbase SpeechRecognition pydub requests
          seleniumbase install chromedriver   # 与 chromium 双备用
          sbase install chromium              # renew.yml 风格备用

      # ── 7. 运行续期脚本 ──────────────────────────────────────────────────
      - name: 🚀 运行续期脚本
        env:
          PYTHONIOENCODING: utf-8
          # WARP SOCKS5 直接在脚本里通过环境变量注入
          WARP_PROXY: "socks5://127.0.0.1:40000"
          # Telegram 通知（两种格式均兼容）
          TG_BOT: ${{ secrets.TG_BOT }}              # 格式: BOT_TOKEN|CHAT_ID
          TG_TOKEN: ${{ secrets.TG_BOT_TOKEN }}       # 单独 token（旧格式兼容）
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}       # 单独 chat_id（旧格式兼容）
          # 账号信息（按实际需要使用）
          GAME4FREE_ACCOUNT: ${{ secrets.GAME4FREE_ACCOUNT }}
        run: |
          mkdir -p screenshots
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            python game4free_renew.py

      # ── 8. 上传截图（始终执行，便于调试） ──────────────────────────────
      - name: 📸 上传截图 & 页面源码
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: |
            *.png
            page_source.html
          if-no-files-found: warn

      # ── 9. KeepAlive：防止仓库因无提交被 GitHub 暂停 Actions ───────────
      - name: 🔄 KeepAlive
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          echo "最后运行时间: $(date)" > time.txt
          git add time.txt
          if git diff --staged --quiet; then
            echo "没有内容变化，跳过推送。"
          else
            git commit -m "⏰ KeepAlive: $(date +'%Y-%m-%d %H:%M UTC')"
            git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
              HEAD:main --force
          fi
